<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop Rush · Proyector (prototipo)</title>
  <link rel="stylesheet" href="./host.css">
</head>
<body class="np-base">
  <header class="barra" data-np-tema="cacao">
    <p class="np-logo-juego barra__logo">Drop <span>Rush</span></p>
    <span class="np-etiqueta">Fase 0 · prototipo técnico</span>
    <span id="red" class="barra__red">–</span>
  </header>

  <main class="host">
    <section class="panel">
      <h2 class="np-etiqueta">Partida</h2>
      <div class="controles">
        <label>Preguntas <input id="cfg-preguntas" type="number" min="1" max="12" value="6"></label>
        <label>Tramo (s) <input id="cfg-tramo" type="number" min="3" max="60" value="15"></label>
        <label>Pregunta (s) <input id="cfg-pregunta" type="number" min="3" max="60" value="15"></label>
        <label>Obstáculos
          <select id="cfg-dificultad">
            <option value="facil">Fácil</option>
            <option value="normal">Normal</option>
            <option value="caotico">Caótico</option>
          </select>
        </label>
      </div>
      <div class="controles">
        <button id="btn-empezar" class="np-boton np-boton--acento">Empezar</button>
        <button id="btn-terminar" class="np-boton np-boton--secundario">Terminar</button>
        <button id="btn-liberar" class="np-boton np-boton--secundario">Liberar todos los grupos</button>
      </div>
      <p id="fase" class="fase">Sin partida</p>
      <div id="pregunta" class="pregunta" hidden></div>
    </section>

    <section class="panel">
      <h2 class="np-etiqueta">Grupos</h2>
      <div id="grilla" class="np-grilla-grupos"></div>
    </section>

    <section class="panel panel--ancho">
      <h2 class="np-etiqueta">Carrera (distancia total)</h2>
      <ol id="ranking" class="carrera"></ol>
    </section>

    <section class="panel">
      <h2 class="np-etiqueta">Servidor</h2>
      <pre id="stats">–</pre>
    </section>

    <section class="panel">
      <h2 class="np-etiqueta">Mediciones de FPS de los celulares</h2>
      <div class="tabla"><table id="informes"></table></div>
    </section>
  </main>

  <script type="module" src="./host.js"></script>
</body>
</html>
