# Deploy en Fly.io (sección 10.A): región São Paulo, una sola máquina que no se duerme.
# El estado de la partida vive en memoria: tiene que haber UNA sola máquina (fly scale count 1).
#   fly launch --no-deploy --copy-config   (la primera vez; elegir otro nombre si "drop-rush" está tomado)
#   fly deploy

app = "drop-rush"
primary_region = "gru"

[build]
  dockerfile = "juego/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
